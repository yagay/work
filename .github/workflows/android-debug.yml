name: Android Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_LIST="$(sdkmanager --list --channel=3)"
          printf '%s\n' "$SDK_LIST" | grep -Ei 'cinnamon|platforms;android-37|build-tools;37' || true
          PLATFORM="$(printf '%s\n' "$SDK_LIST" | awk -F'|' 'tolower($0) ~ /cinnamon/ && $1 ~ /platforms;android-/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          if [ -z "$PLATFORM" ]; then
            PLATFORM="$(printf '%s\n' "$SDK_LIST" | awk -F'|' '$1 ~ /platforms;android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          fi
          BUILD_TOOLS="$(printf '%s\n' "$SDK_LIST" | awk -F'|' '$1 ~ /build-tools;37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          echo "Selected platform: $PLATFORM"
          echo "Selected build tools: $BUILD_TOOLS"
          test -n "$PLATFORM"
          test -n "$BUILD_TOOLS"
          sdkmanager --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkHoursApp-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

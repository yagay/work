name: Android Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 37.0
        run: |
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Print lint report
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          fi

      - name: Build arm64-v8a debug APK
        run: gradle -PciArm64Only=true :app:assembleDebug --stacktrace

      - name: Prepare fixed APK name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -path '*/debug/*' | head -n 1)"
          test -n "$APK"
          ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected ABIs in APK: $ABIS"
            exit 1
          fi
          cp "$APK" artifacts/WorkHoursApp-debug-arm64-v8a.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkHoursApp-debug-arm64-v8a
          path: artifacts/WorkHoursApp-debug-arm64-v8a.apk
          if-no-files-found: error

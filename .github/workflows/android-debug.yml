name: Android Debug Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37.0
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Fix Android view imports for build
        run: |
          sed -i 's/import android\.app\.ActionMode;/import android.view.ActionMode;/' app/src/main/java/com/example/workhours/WorkHoursApplication.java
          sed -i 's/import android\.app\.SearchEvent;/import android.view.SearchEvent;/' app/src/main/java/com/example/workhours/WorkHoursApplication.java

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkHoursApp-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Refactor wage mode settings

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply refactor
        run: python3 tools/refactor_wage_mode_settings.py

      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/workhours/WageActivity.java
            git commit -m "Separate hourly and monthly wage settings"
            git push
          fi

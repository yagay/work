name: Switch to system clock alarm
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/switch_to_system_alarm.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/workhours/SettingsActivity.java app/src/main/java/com/example/workhours/MainActivity.java app/src/main/java/com/example/workhours/WorkAlarmRescheduleReceiver.java app/src/main/AndroidManifest.xml
            git commit -m "Switch work alarm to system Clock"
            git push
          fi

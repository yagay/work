name: Apply holiday history
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/add_holiday_history.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/workhours/HolidayCalendar.java app/src/main/java/com/example/workhours/SettingsActivity.java app/src/main/java/com/example/workhours/MainActivity.java app/src/main/java/com/example/workhours/WagePanel.java
            git commit -m "Preserve holiday regions by effective date"
            git push
          fi

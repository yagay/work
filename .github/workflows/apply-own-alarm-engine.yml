name: Apply own alarm engine
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/replace_alarm_engine.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/AndroidManifest.xml app/src/main/java/com/example/workhours/WorkAlarmManager.java app/src/main/java/com/example/workhours/WorkAlarmReceiver.java app/src/main/java/com/example/workhours/WorkAlarmRingService.java app/src/main/java/com/example/workhours/WorkAlarmActivity.java app/src/main/java/com/example/workhours/WorkAlarmRescheduleReceiver.java app/src/main/java/com/example/workhours/SettingsActivity.java
            git commit -m "Replace clock intents with reliable app alarms"
            git push
          fi

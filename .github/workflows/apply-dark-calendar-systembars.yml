name: Apply dark calendar and system bars fix
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_dark_calendar_systembars.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/workhours/UiStyle.java app/src/main/java/com/example/workhours/AppThemeManager.java app/src/main/java/com/example/workhours/MainActivity.java app/src/main/java/com/example/workhours/SettingsActivity.java
            git commit -m "Fix dark calendar and system bars colors"
            git push
          fi
